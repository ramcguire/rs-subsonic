[package]
name = "rsub-sync"
description = "Catalog sync engine for rs-subsonic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Run tests against Postgres too (with RSUB_TEST_PG_URL).
postgres = ["rsub-store/postgres"]

[dependencies]
rsub-core.workspace = true
rsub-store.workspace = true
futures-util.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time", "fs", "io-util"] }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
rsub-store = { workspace = true, features = ["sqlite"] }
rsub-testkit.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
