[package]
name = "rsub-server"
description = "HTTP server exposing the OpenSubsonic API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# OpenSubsonic sonicSimilarity over rsub-analysis's index, and sonic neighbours
# as the last tier of similar artists.
sonic = ["dep:rsub-analysis"]
# Run tests against Postgres too (with RSUB_TEST_PG_URL).
postgres = ["rsub-store/postgres"]

[dependencies]
rsub-api.workspace = true
rsub-core.workspace = true
rsub-media.workspace = true
rsub-analysis = { workspace = true, optional = true }
rsub-store.workspace = true
rsub-sync.workspace = true
axum.workspace = true
bytes.workspace = true
form_urlencoded.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true

[dev-dependencies]
hex.workspace = true
rsub-analysis.workspace = true
rsub-store = { workspace = true, features = ["sqlite"] }
rsub-testkit.workspace = true
tower.workspace = true

[[test]]
name = "sonic"
required-features = ["sonic"]

[[test]]
name = "admin"
required-features = ["sonic"]
