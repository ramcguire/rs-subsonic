[package]
name = "rsub-store"
description = "SQLite/Postgres persistence for rs-subsonic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["sqlite"]
sqlite = ["sqlx/sqlite", "dep:sqlite-vec", "dep:libsqlite3-sys"]
postgres = ["sqlx/postgres", "sqlx/tls-rustls"]

[dependencies]
rsub-core.workspace = true
hex.workspace = true
sea-query.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "migrate", "derive", "macros"] }
thiserror.workspace = true
tracing.workspace = true
# sqlite-vec searches vectors; it's registered with the SQLite sqlx bundles,
# so libsqlite3-sys must be the version sqlx uses.
libsqlite3-sys = { version = "0.37", optional = true }
sqlite-vec = { version = "=0.1.9", optional = true }

[dev-dependencies]
rsub-testkit.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
