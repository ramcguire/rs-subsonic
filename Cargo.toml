[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0-rc.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rsub-api = { path = "crates/rsub-api" }
rsub-core = { path = "crates/rsub-core" }
rsub-store = { path = "crates/rsub-store", default-features = false }
rsub-server = { path = "crates/rsub-server" }
rsub-analysis = { path = "crates/rsub-analysis" }
rsub-media = { path = "crates/rsub-media" }
rsub-plex = { path = "crates/rsub-plex" }
rsub-sync = { path = "crates/rsub-sync" }
rsub-testkit = { path = "crates/rsub-testkit" }

argh = "0.1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "form", "tracing"] }
base64 = "0.23"
bytes = "1"
chacha20poly1305 = "0.11"
deunicode = "1"
form_urlencoded = "1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
hex = "0.4"
insta = "1"
lofty = "0.25"
md-5 = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sea-query = { version = "1", default-features = false, features = ["thread-safe", "backend-sqlite", "backend-postgres"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false }
subtle = "2"
thiserror = "2"
rpassword = "7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "time"] }
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
toml = "1"
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.7", default-features = false, features = ["cors", "trace", "catch-panic", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[package]
name = "rs-subsonic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["sqlite", "local-tags"]
sqlite = ["rsub-store/sqlite"]
postgres = ["rsub-store/postgres"]
local-tags = ["rsub-media/local-tags"]
mimalloc = ["dep:mimalloc"]
# Sonic similarity from local audio analysis ([analysis]), with either
# analyzer or both; without them the analysis crate isn't built at all.
# bliss-audio is GPL-3.0-only, so a binary built with `bliss` is GPL-3.0.
bliss = ["dep:rsub-analysis", "rsub-analysis/bliss", "rsub-server/sonic"]
clap = ["dep:rsub-analysis", "rsub-analysis/clap", "rsub-server/sonic"]

[dependencies]
rsub-core.workspace = true
rsub-store.workspace = true
rsub-server.workspace = true
rsub-analysis = { workspace = true, optional = true }
rsub-media.workspace = true
rsub-plex.workspace = true
rsub-sync.workspace = true
argh.workspace = true
mimalloc = { version = "0.1", optional = true, default-features = false }
serde.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
hex.workspace = true
rpassword.workspace = true

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"
